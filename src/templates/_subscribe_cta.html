{# Coverage-alert subscription CTA.

   Ships as an inert <template>: coverage-subscribe.js clones it into
   #sidebar after an address search and wires #coverage-subscribe-btn.
   Static copy is server-translated via _(); dynamic status messages are
   set from JS via t(). Logged-out clicks open the sign-in modal first
   (handled in coverage-subscribe.js). Included once on the map page. #}
<template id="coverageSubscribeCtaTemplate">
  <div id="coverage-subscribe-cta"
       class="col-span-full mb-2 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 flex flex-col gap-2">
    <div class="text-sm text-gray-800 dark:text-gray-100" data-subscribe-label>
      <span class="font-semibold">{{ _('Subscribe to coverage changes at this address') }}</span>
      <span class="text-gray-600 dark:text-gray-300">— {{ _("we'll email you after our monthly UKE data refresh.") }}</span>
    </div>
    <div class="flex items-center gap-2" data-subscribe-row>
      <span class="flex-1 min-w-0 text-sm text-gray-600 dark:text-gray-300 truncate" data-subscribe-address></span>
      <button type="button" id="coverage-subscribe-btn"
              class="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-1.5 px-3 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-800 transition-colors">
        {{ _('Subscribe') }}
      </button>
    </div>
  </div>
</template>
