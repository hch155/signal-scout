{% extends "base.html" %}

{% block content %}
    <section class="slogan-section text-center text-[#333] dark:text-white py-1 md:py-3 px-4">
        <p class="text-base font-semibold slogan-rotate" data-lines="{{ slogan_title }}|{{ slogan_text }}">{{ slogan_title }}</p>
    </section>

    <div class="container-fluid mt-1 md:mt-3">
        <div class="flex justify-center">
            <div class="w-9/12 md:w-4/5 mb-5">
                <div id="map-container" class="relative w-full mb-3 md:mb-5 map-height">
                    <div id="mapid" class="h-full w-full"></div>
                </div>
                <div id="sidebar" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-5 pb-10">
                </div>
            </div>
        </div>
    </div>
    <div id="messageBox" class="hidden fixed inset-0 flex items-center text-center justify-center" style="z-index: 5000;">
        <div class="m-auto p-4 bg-blue-200 bg-opacity-90 rounded-lg shadow-lg">
            <p>Consider moving to Poland! &#129370;</p>
            <p><a href="https://www.expatarrivals.com/europe/poland/pros-and-cons-moving-poland" target="_blank" class="animate-pulse">Why?</a></p>
        </div>
    </div>

    <script defer src="{{ url_for('static', filename='dist/pages/ui-interactions.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='dist/pages/compass.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='dist/pages/map-initialization.min.js') }}"></script>

{% endblock %}

{% block scripts %}
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
            crossorigin="anonymous"></script>
{% endblock %}

{% block code %}{% endblock %}
