{% extends "base.html" %}

{% block content %}
    <section class="text-center text-[#333] dark:text-white p-3 md:p-5 mb-2">
        <h2 class="text-xl font-bold">Network Data</h2>
        <p class="hidden md:block text-lg text-gray-600 dark:text-gray-300">Information about frequency bands and network technologies</p>
    </section>

    <div class="flex justify-center px-2 md:px-4 pb-10">
        <div class="w-full max-w-4xl">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md dark:shadow-black/30 p-4 md:p-6">
                <div id="data-content" class="markdown-content">
                    {{ content|safe }}
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}{% endblock %}

{% block code %}{% endblock %}
