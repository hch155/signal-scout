# Forgejo Actions: monthly UKE data refresh on the self-hosted runner.
#
# Auth: uses the run's automatic token (github.token) exactly like ci-cd.yml's
# actions/checkout. A user PAT (FORGEJO_PUSH_TOKEN) was 401'd by the runner's
# forgejo path; the automatic token authenticates fine.
# Mirrors ci-cd.yml: node:20-bookworm-slim + actions/checkout + apt python
# (actions/checkout is a Node action, so the container must ship Node).

name: Monthly Database Update

on:
  schedule:
    - cron: '0 4 27 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    name: UKE data refresh
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 30
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - name: install python (node base needs python via apt)
        run: |
          for i in 1 2 3 4; do
            apt-get -o Acquire::Retries=5 update -qq \
              && apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-pip git curl build-essential libsqlite3-dev \
              && break
            echo "apt attempt $i failed (DNS/WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done

      - name: install dependencies
        run: |
          for i in 1 2 3 4; do
            python3 -m pip install --break-system-packages --no-cache-dir -r requirements.txt openpyxl \
              && break
            echo "pip attempt $i failed (WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

      - name: Save previous record count
        id: prev_count
        run: |
          count=$(python3 -c "
          import sqlite3, os
          db = os.path.join('$GITHUB_WORKSPACE', 'src', 'instance', 'stations.db')
          conn = sqlite3.connect(db)
          print(conn.execute('SELECT COUNT(*) FROM base_station').fetchone()[0])
          conn.close()
          ")
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Clean old Excel files
        run: rm -f base_station_data/*.xlsx

      - name: Download new UKE data
        run: |
          for i in 1 2 3; do
            python3 scripts/download_uke_data.py && break
            echo "download attempt $i failed, retry in $((i*20))s"; sleep $((i*20)); [ "$i" = 3 ] && exit 1
          done

      - name: Validate downloads
        run: python3 scripts/validate_db_update.py --step downloads

      - name: Backup current database
        run: cp src/instance/stations.db src/instance/stations.db.bak

      - name: Rebuild database
        run: python3 scripts/stations_database_setup.py

      - name: Validate new database
        run: |
          python3 scripts/validate_db_update.py \
            --step database \
            --previous-count ${{ steps.prev_count.outputs.count }}

      - name: Update data.md with new date
        run: python3 scripts/update_data_date.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "forgejo-actions[bot]@example.local"
          SERVER="${GITHUB_SERVER_URL#https://}"
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          PUSH_DIR="$(mktemp -d)"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" clone --depth 1 --branch main \
              "https://${SERVER}/${GITHUB_REPOSITORY}.git" "$PUSH_DIR" && break
            echo "push-clone attempt $i failed, retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 3 ] && exit 1
          done
          rm -f "$PUSH_DIR"/base_station_data/*.xlsx
          cp base_station_data/*.xlsx "$PUSH_DIR"/base_station_data/
          cp src/instance/stations.db "$PUSH_DIR"/src/instance/stations.db
          cp src/content/data.md "$PUSH_DIR"/src/content/data.md
          cd "$PUSH_DIR"
          git add -A base_station_data src/instance/stations.db src/content/data.md
          if git diff --cached --quiet; then
            echo "No changes from UKE this month"; exit 0
          fi
          git commit -m "chore: database update $(date +'%B %Y')"
          for i in 1 2 3; do
            git -c http.extraheader="$AUTH" push origin HEAD:main && break
            echo "push attempt $i failed, retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 3 ] && exit 1
          done

      - name: Open failure issue on Forgejo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date +'%B %Y')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf '{"title":"Database Update Failed - %s","body":"Workflow run: %s\\n\\nCheck runner logs.","labels":["automated","database-update"]}' "$MONTH" "$RUN_URL")
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$BODY" || echo "::warning::could not open failure issue for ${MONTH}"
