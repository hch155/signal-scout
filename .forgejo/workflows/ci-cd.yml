# Forgejo Actions CI/CD for signal-scout
#
# Job graph:
#   lint --+-- test ----------------------------------------------+
#          +-- security-fs-scan                                   |
#                                                                  v
#   (push/dispatch only)                               build + push Harbor
#                                                                  |
#                                                       image-scan (Trivy)
#                                                                  |
#                                         (push to main only) promote
#                                                                  |
#                                                       deploy-staging
#                                                                  |
#                                                      smoke-staging (2 min)
#                                                                  | pass
#                                                          deploy-prod
#                                                                  |
#                                                   smoke-prod (4 min) / rollback
#
# VERSION SCHEME:
#   push main  -> YYYY.MM.DD-<sha7>-staging  (staging image)
#              -> YYYY.MM.DD-<sha7>           (prod image -- re-tagged, same digest)
#   tag v*     -> git tag value (e.g. v2026.05.15) — builds + scans a release
#                 image ONLY; does NOT auto-deploy (promote + deploy gate on
#                 refs/heads/main). Deploy a tag by moving main, not by tagging.
#
# PROMOTION MODEL:
#   No rebuild. After image-scan passes, runner pulls staging digest, re-tags
#   as prod, pushes. Same bits -- guaranteed bit-for-bit identical to what
#   staging ran. Zero network transfer for the layers (Harbor dedupes by digest).
#
# ROLLBACK:
#   deploy-prod captures the current prod tag first (fail-closed — aborts if it
#   can't read it). If the new image's smoke (version + readyz + OAuth 302)
#   never converges, it re-deploys the captured tag via Portainer with
#   pullImage=false — the locally-cached last-good image, so rollback works
#   even when Harbor is down (the prune keeps tagged images).

name: CI/CD signal-scout

# Serialize per ref so a push and the monthly cron can't race two deploys onto
# the same Portainer stack out of order. Queue (don't cancel) — a deploy in
# flight must finish, not be interrupted mid-PUT.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, staging]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Monthly: deploy the UKE data refresh. monthly-db-update.yml commits the new
  # stations.db with the auto-token, which forgejo (like GitHub) does NOT let
  # trigger a push event — so this scheduled run, 2 h after the 04:00 refresh,
  # builds + deploys main's HEAD and carries the fresh data to prod.
  schedule:
    - cron: '0 6 27 * *'

env:
  HARBOR_REGISTRY: harbor.example.local
  IMAGE_BASE:      harbor.example.local/signal-scout/app
  LXC_IP:          LXC_LAN_IP
  # pip's default 15s socket timeout is too short for the runner's WiFi backhaul;
  # give downloads room + let pip retry internally.
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES:         "5"

jobs:
  lint:
    name: lint (ruff + bandit + pip-audit)
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install python (node base needs python via apt)
        run: |
          for i in 1 2 3; do
            apt-get -o Acquire::Retries=5 update -qq \
              && apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-pip git \
              && break
            echo "apt attempt $i failed (DNS/WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done
      - name: install lint tools
        run: python3 -m pip install --break-system-packages --no-cache-dir ruff bandit pip-audit
      - name: ruff
        run: python3 -m ruff check src/ tests/
      - name: bandit (HIGH+CRITICAL gate)
        run: python3 -m bandit -r src/ -lll -iii
      - name: pip-audit (non-strict, log only)
        continue-on-error: true
        run: python3 -m pip_audit -r requirements.txt || true

  test:
    name: test (pytest >=75% coverage)
    needs: lint
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install python (node base needs python via apt)
        run: |
          for i in 1 2 3 4; do
            apt-get -o Acquire::Retries=5 update -qq \
              && apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-pip git curl build-essential libsqlite3-dev \
              && break
            echo "apt attempt $i failed (DNS/WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done
      - name: install deps
        run: |
          for i in 1 2 3 4; do
            python3 -m pip install --break-system-packages --no-cache-dir -r requirements.txt \
              && python3 -m pip install --break-system-packages --no-cache-dir -r tests/requirements-test.txt \
              && break
            echo "pip install attempt $i failed (WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done
      - name: pytest + coverage gate
        run: |
          PYTHONPATH=src python3 -m pytest tests/unit tests/integration \
            -v --cov=src --cov-fail-under=75

  security-fs-scan:
    name: trivy fs scan
    needs: lint
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor > /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb bookworm main" > /etc/apt/sources.list.d/trivy.list
          apt-get update -qq && apt-get install -y trivy
      - name: trivy fs (advisory — log only, don't block)
        continue-on-error: true
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs tools,src/static/vendor,node_modules,mobile . || true

  build:
    name: build + push Harbor (staging tag)
    needs: [test]
    # security-fs-scan is advisory (continue-on-error) — runs in parallel, doesn't gate.
    # Re-tighten by adding 'security-fs-scan' to needs[] once trivy CI/local mismatch resolved.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    outputs:
      staging_tag: ${{ steps.ver.outputs.staging_tag }}
      prod_tag:    ${{ steps.ver.outputs.prod_tag }}
      image_ref:   ${{ steps.ver.outputs.image_ref }}
    # Use runner's local Docker daemon (the CI runner host has dockerd installed).
    # Removed DinD service — simpler, faster, no inter-container networking.
    steps:
      - uses: actions/checkout@v4

      - name: verify docker on runner
        run: docker info

      - name: harbor login
        env:
          HARBOR_USER:     ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for i in 1 2 3; do
            printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USER" --password-stdin && break
            echo "harbor login attempt $i failed (WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done

      - name: compute version tags
        id: ver
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          CALVER="$(date -u +%Y.%m.%d)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE="${GITHUB_REF#refs/tags/}"
            STAGING_TAG="${RELEASE}-staging"
            PROD_TAG="${RELEASE}"
          else
            STAGING_TAG="${CALVER}-${SHA7}-staging"
            PROD_TAG="${CALVER}-${SHA7}"
          fi
          echo "staging_tag=${STAGING_TAG}" >> "$GITHUB_OUTPUT"
          echo "prod_tag=${PROD_TAG}"       >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.IMAGE_BASE }}:${STAGING_TAG}" >> "$GITHUB_OUTPUT"
          echo "STAGING_TAG=${STAGING_TAG}" >> "$GITHUB_ENV"
          echo "PROD_TAG=${PROD_TAG}"       >> "$GITHUB_ENV"

      - name: docker build (staging tag)
        run: |
          for i in 1 2 3; do
            docker build \
              -t "${{ env.IMAGE_BASE }}:${STAGING_TAG}" \
              --build-arg APP_VERSION="${STAGING_TAG}" \
              --build-arg GIT_SHA="${GITHUB_SHA}" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${STAGING_TAG}" \
              . && break
            echo "build attempt $i failed (WiFi?), retry in $((i*20))s"; sleep $((i*20)); [ "$i" = 3 ] && exit 1
          done

      - name: push staging image
        run: |
          for i in 1 2 3 4 5; do
            docker push "${{ env.IMAGE_BASE }}:${STAGING_TAG}" && break
            echo "push attempt $i failed (WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done

      - name: cleanup runner disk
        if: always()
        run: docker image rm "${{ env.IMAGE_BASE }}:${STAGING_TAG}" || true

  image-scan:
    name: trivy image scan (post-build, Harbor pull)
    needs: build
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    container:
      image: docker.io/aquasec/trivy:latest
    env:
      TRIVY_USERNAME: ${{ secrets.HARBOR_USER }}
      TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: fetch .trivyignore (this job pulls the image, it has no checkout)
        run: |
          wget -q --header="Authorization: token ${FORGEJO_TOKEN}" \
            -O .trivyignore \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/branch/${GITHUB_REF_NAME}/.trivyignore" \
            2>/dev/null \
            || echo "# .trivyignore unavailable in image-scan job (fetch failed)" > .trivyignore
      - name: scan pushed staging image
        run: |
          for i in 1 2 3; do
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --ignorefile .trivyignore \
              --scanners vuln,secret \
              --timeout 15m \
              "${{ needs.build.outputs.image_ref }}" && break
            echo "trivy scan attempt $i failed (flaky Harbor pull / truncated layer?), retry in $((i*15))s"
            sleep $((i*15))
            [ "$i" = 3 ] && exit 1
          done

  promote:
    name: promote staging digest -> prod tag (no rebuild)
    needs: [build, image-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    # Uses runner's local Docker daemon — same as build job
    steps:
      - name: harbor login
        env:
          HARBOR_USER:     ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for i in 1 2 3; do
            printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USER" --password-stdin && break
            echo "harbor login attempt $i failed (WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done
      - name: re-tag staging -> prod (same digest)
        env:
          STAGING_REF: ${{ needs.build.outputs.image_ref }}
          PROD_TAG:    ${{ needs.build.outputs.prod_tag }}
        run: |
          for i in 1 2 3 4 5; do
            docker pull "${STAGING_REF}" \
              && docker tag "${STAGING_REF}" "${{ env.IMAGE_BASE }}:${PROD_TAG}" \
              && docker push "${{ env.IMAGE_BASE }}:${PROD_TAG}" \
              && break
            echo "promote attempt $i failed (WiFi/DNS?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
          docker image rm "${STAGING_REF}" "${{ env.IMAGE_BASE }}:${PROD_TAG}" || true

  deploy-staging:
    name: deploy staging
    # promote intentionally NOT in needs[]: a push to the `staging` branch
    # deploys staging from the staging tag without minting a prod tag.
    # deploy-prod still requires promote, which only runs on main — so the
    # staging branch can never reach production.
    # image-scan IS required: public staging must be gated by the same
    # vulnerability scan as prod.
    needs: [build, image-scan]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.signal-scout.com
    steps:
      - uses: actions/checkout@v4
      - name: deploy staging via Portainer standard stack
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STAGING_TAG:         ${{ needs.build.outputs.staging_tag }}
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/portainer_deploy.py 29 21 "$STAGING_TAG" deploy/signal-scout-staging.compose.yml && break
            echo "deploy attempt $i failed (WiFi/timeout?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
      - name: smoke staging (version + readyz, 3 consecutive, 2-min window)
        env:
          EXPECT_TAG: ${{ needs.build.outputs.staging_tag }}
        run: |
          set +e
          base=https://staging.signal-scout.com
          streak=0
          for i in $(seq 1 24); do
            ver=$(curl -s -m 5 "$base/api/v1/healthz" | sed -n 's/.*"version"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
            ready=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$base/readyz")
            if [ "$ver" = "$EXPECT_TAG" ] && [ "$ready" = "200" ]; then
              streak=$((streak+1)); echo "ok $i (streak $streak): version=$ver readyz=$ready"
              [ "$streak" -ge 3 ] && { echo "staging healthy"; exit 0; }
            else
              streak=0; echo "not-ready $i: version=$ver (want $EXPECT_TAG) readyz=$ready"
            fi
            sleep 5
          done
          echo "staging failed to converge on version=$EXPECT_TAG + readyz=200"; exit 1

  deploy-prod:
    name: deploy production
    needs: [build, promote, deploy-staging]
    # Load-bearing: prod requires main + a genuinely-passed staging smoke.
    # No `|| skipped` — on main deploy-staging always runs, so a skip means a
    # config mistake, and prod must not proceed without staging validation.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      needs.promote.result == 'success' &&
      needs.deploy-staging.result == 'success'
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 25
    environment:
      name: production
      url: https://signal-scout.com
    steps:
      - uses: actions/checkout@v4
      - name: capture current prod tag (rollback target)
        id: prev
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
        run: |
          # Fail-closed: gettag now exits non-zero if it cannot read the stack,
          # so a flaky Portainer read aborts the deploy instead of proceeding
          # with an empty (rollback-disarming) tag.
          tag=$(python3 scripts/portainer_deploy.py gettag 28) || {
            echo "cannot resolve current prod tag — refusing to deploy without a rollback target"; exit 1; }
          echo "resolved rollback target: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: deploy prod via Portainer standard stack
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PROD_TAG:            ${{ needs.build.outputs.prod_tag }}
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/portainer_deploy.py 28 21 "$PROD_TAG" deploy/signal-scout-prod.compose.yml && break
            echo "deploy attempt $i failed (WiFi/timeout?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
      - name: smoke prod (version + readyz + OAuth, 3 consecutive, 4-min window)
        id: smoke_prod
        env:
          EXPECT_TAG: ${{ needs.build.outputs.prod_tag }}
        run: |
          set +e
          base=https://signal-scout.com
          streak=0
          for i in $(seq 1 48); do
            ver=$(curl -s -m 5 "$base/api/v1/healthz" | sed -n 's/.*"version"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
            ready=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "$base/readyz")
            # OAuth readiness: /auth/google/login must 302 to Google. This is the
            # exact check that /healthz cannot make — it stays 200 with OAuth dead.
            oauth=$(curl -s -m 5 -o /dev/null -w '%{redirect_url}' "$base/auth/google/login")
            if [ "$ver" = "$EXPECT_TAG" ] && [ "$ready" = "200" ] && echo "$oauth" | grep -q 'accounts.google.com'; then
              streak=$((streak+1)); echo "ok $i (streak $streak): version=$ver readyz=$ready oauth=up"
              [ "$streak" -ge 3 ] && { echo "prod healthy"; exit 0; }
            else
              streak=0; echo "not-ready $i: version=$ver (want $EXPECT_TAG) readyz=$ready oauth=$oauth"
            fi
            sleep 5
          done
          echo "prod failed to converge (version/readyz/OAuth) — triggering rollback"; exit 1
      - name: auto-rollback on prod smoke failure (Harbor-independent)
        if: failure() && steps.smoke_prod.outcome == 'failure' && steps.prev.outputs.tag != ''
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          # pullImage=false: roll back using the locally-cached previous image
          # so rollback works even when Harbor is down (the prune now keeps
          # tagged images, so the last-good image is still present locally).
          PORTAINER_PULL:      "false"
        run: |
          echo "rolling back prod to ${{ steps.prev.outputs.tag }} (local image, no Harbor pull)"
          for i in 1 2 3; do
            python3 scripts/portainer_deploy.py 28 21 "${{ steps.prev.outputs.tag }}" deploy/signal-scout-prod.compose.yml && break
            echo "rollback attempt $i failed, retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done

  coverage-sweep:
    name: coverage alert sweep (post-deploy)
    needs: [deploy-prod]
    if: needs.deploy-prod.result == 'success'
    runs-on: [self-hosted, signal-scout-runner]
    environment:
      name: production
      url: https://signal-scout.com
    timeout-minutes: 10
    steps:
      - name: ssh -> prod LXC + run sweep inside the app container
        env:
          SSH_KEY: ${{ secrets.LXC_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/lxc_deploy
          chmod 600 ~/.ssh/lxc_deploy
          ssh-keyscan -H "${{ env.LXC_IP }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/lxc_deploy -o StrictHostKeyChecking=accept-new \
              deploy@"${{ env.LXC_IP }}" bash -s <<'REMOTE'
            set -euo pipefail
            docker exec signal-scout-prod python -m run_coverage_sweep --verbose
          REMOTE

  notify-failure:
    name: open a Forgejo issue on pipeline failure
    # Fires when any job that actually RAN fails. Note: this cannot fire if the
    # run never started (the push->no-run breakage) or the runner itself is
    # offline — that gap is covered by the out-of-band heartbeat canary
    # (scripts/prod_canary.sh), which lives outside this pipeline entirely.
    needs: [lint, test, security-fs-scan, build, image-scan, promote, deploy-staging, deploy-prod, coverage-sweep]
    if: failure()
    runs-on: [self-hosted, signal-scout-runner]
    timeout-minutes: 5
    steps:
      - name: open failure issue on Forgejo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf '{"title":"CI/CD failed on %s (%s)","body":"Run: %s\\n\\nA pipeline job failed. If it failed after deploy-prod, an automatic rollback to the previous image should have run — verify prod. Check runner logs.","labels":["automated","ci-cd"]}' "${GITHUB_REF_NAME}" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$BODY" || echo "::warning::could not open failure issue"
