# Forgejo Actions CI/CD for signal-scout
#
# Job graph:
#   lint --+-- test ----------------------------------------------+
#          +-- security-fs-scan                                   |
#                                                                  v
#   (push/dispatch only)                               build + push Harbor
#                                                                  |
#                                                       image-scan (Trivy)
#                                                                  |
#                                         (push to main only) promote
#                                                                  |
#                                                       deploy-staging
#                                                                  |
#                                                      smoke-staging (2 min)
#                                                                  | pass
#                                                          deploy-prod
#                                                                  |
#                                                   smoke-prod (4 min) / rollback
#
# VERSION SCHEME:
#   push main  -> YYYY.MM.DD-<sha7>-staging  (staging image)
#              -> YYYY.MM.DD-<sha7>           (prod image -- re-tagged, same digest)
#   tag v*     -> git tag value (e.g. v2026.05.15)  (explicit immutable release)
#
# PROMOTION MODEL:
#   No rebuild. After image-scan passes, runner pulls staging digest, re-tags
#   as prod, pushes. Same bits -- guaranteed bit-for-bit identical to what
#   staging ran. Zero network transfer for the layers (Harbor dedupes by digest).
#
# ROLLBACK:
#   On prod smoke failure the runner SSHs in, restores IMAGE_TAG from
#   .env.bak (written before every deploy), and does compose up.

name: CI/CD signal-scout

on:
  push:
    branches: [main, staging]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.example.local
  IMAGE_BASE:      harbor.example.local/signal-scout/app
  LXC_IP:          LXC_LAN_IP
  # pip's default 15s socket timeout is too short for the runner's WiFi backhaul;
  # give downloads room + let pip retry internally.
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES:         "5"

jobs:
  lint:
    name: lint (ruff + bandit + pip-audit)
    runs-on: [self-hosted, signal-scout-runner]
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install python (node base needs python via apt)
        run: |
          for i in 1 2 3; do
            apt-get -o Acquire::Retries=5 update -qq \
              && apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-pip git \
              && break
            echo "apt attempt $i failed (DNS/WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done
      - name: install lint tools
        run: python3 -m pip install --break-system-packages --no-cache-dir ruff bandit pip-audit
      - name: ruff
        run: python3 -m ruff check src/ tests/
      - name: bandit (HIGH+CRITICAL gate)
        run: python3 -m bandit -r src/ -lll -iii
      - name: pip-audit (non-strict, log only)
        continue-on-error: true
        run: python3 -m pip_audit -r requirements.txt || true

  test:
    name: test (pytest >=75% coverage)
    needs: lint
    runs-on: [self-hosted, signal-scout-runner]
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install python (node base needs python via apt)
        run: |
          for i in 1 2 3 4; do
            apt-get -o Acquire::Retries=5 update -qq \
              && apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-pip git curl build-essential libsqlite3-dev \
              && break
            echo "apt attempt $i failed (DNS/WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done
      - name: install deps
        run: |
          for i in 1 2 3 4; do
            python3 -m pip install --break-system-packages --no-cache-dir -r requirements.txt \
              && python3 -m pip install --break-system-packages --no-cache-dir -r tests/requirements-test.txt \
              && break
            echo "pip install attempt $i failed (WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 4 ] && exit 1
          done
      - name: pytest + coverage gate
        run: |
          PYTHONPATH=src python3 -m pytest tests/unit tests/integration \
            -v --cov=src --cov-fail-under=75

  security-fs-scan:
    name: trivy fs scan
    needs: lint
    runs-on: [self-hosted, signal-scout-runner]
    container:
      image: docker.io/library/node:20-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor > /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb bookworm main" > /etc/apt/sources.list.d/trivy.list
          apt-get update -qq && apt-get install -y trivy
      - name: trivy fs (advisory — log only, don't block)
        continue-on-error: true
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs tools,src/static/vendor,node_modules,mobile . || true

  build:
    name: build + push Harbor (staging tag)
    needs: [test]
    # security-fs-scan is advisory (continue-on-error) — runs in parallel, doesn't gate.
    # Re-tighten by adding 'security-fs-scan' to needs[] once trivy CI/local mismatch resolved.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, signal-scout-runner]
    outputs:
      staging_tag: ${{ steps.ver.outputs.staging_tag }}
      prod_tag:    ${{ steps.ver.outputs.prod_tag }}
      image_ref:   ${{ steps.ver.outputs.image_ref }}
    # Use runner's local Docker daemon (the CI runner host has dockerd installed).
    # Removed DinD service — simpler, faster, no inter-container networking.
    steps:
      - uses: actions/checkout@v4

      - name: verify docker on runner
        run: docker info

      - name: harbor login
        run: |
          for i in 1 2 3; do
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} -u "${{ secrets.HARBOR_USER }}" --password-stdin && break
            echo "harbor login attempt $i failed (WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done

      - name: compute version tags
        id: ver
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          CALVER="$(date -u +%Y.%m.%d)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE="${GITHUB_REF#refs/tags/}"
            STAGING_TAG="${RELEASE}-staging"
            PROD_TAG="${RELEASE}"
          else
            STAGING_TAG="${CALVER}-${SHA7}-staging"
            PROD_TAG="${CALVER}-${SHA7}"
          fi
          echo "staging_tag=${STAGING_TAG}" >> "$GITHUB_OUTPUT"
          echo "prod_tag=${PROD_TAG}"       >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.IMAGE_BASE }}:${STAGING_TAG}" >> "$GITHUB_OUTPUT"
          echo "STAGING_TAG=${STAGING_TAG}" >> "$GITHUB_ENV"
          echo "PROD_TAG=${PROD_TAG}"       >> "$GITHUB_ENV"

      - name: docker build (staging tag)
        run: |
          for i in 1 2 3; do
            docker build \
              -t "${{ env.IMAGE_BASE }}:${STAGING_TAG}" \
              --build-arg APP_VERSION="${STAGING_TAG}" \
              --build-arg GIT_SHA="${GITHUB_SHA}" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${STAGING_TAG}" \
              . && break
            echo "build attempt $i failed (WiFi?), retry in $((i*20))s"; sleep $((i*20)); [ "$i" = 3 ] && exit 1
          done

      - name: push staging image
        run: |
          for i in 1 2 3 4 5; do
            docker push "${{ env.IMAGE_BASE }}:${STAGING_TAG}" && break
            echo "push attempt $i failed (WiFi?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done

      - name: cleanup runner disk
        if: always()
        run: docker image rm "${{ env.IMAGE_BASE }}:${STAGING_TAG}" || true

  image-scan:
    name: trivy image scan (post-build, Harbor pull)
    needs: build
    runs-on: [self-hosted, signal-scout-runner]
    container:
      image: docker.io/aquasec/trivy:latest
    env:
      TRIVY_USERNAME: ${{ secrets.HARBOR_USER }}
      TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: scan pushed staging image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --timeout 15m \
            "${{ needs.build.outputs.image_ref }}"

  promote:
    name: promote staging digest -> prod tag (no rebuild)
    needs: [build, image-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, signal-scout-runner]
    # Uses runner's local Docker daemon — same as build job
    steps:
      - name: harbor login
        run: |
          for i in 1 2 3; do
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.HARBOR_REGISTRY }} -u "${{ secrets.HARBOR_USER }}" --password-stdin && break
            echo "harbor login attempt $i failed (WiFi?), retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done
      - name: re-tag staging -> prod (same digest)
        env:
          STAGING_REF: ${{ needs.build.outputs.image_ref }}
          PROD_TAG:    ${{ needs.build.outputs.prod_tag }}
        run: |
          for i in 1 2 3 4 5; do
            docker pull "${STAGING_REF}" \
              && docker tag "${STAGING_REF}" "${{ env.IMAGE_BASE }}:${PROD_TAG}" \
              && docker push "${{ env.IMAGE_BASE }}:${PROD_TAG}" \
              && break
            echo "promote attempt $i failed (WiFi/DNS?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
          docker image rm "${STAGING_REF}" "${{ env.IMAGE_BASE }}:${PROD_TAG}" || true

  deploy-staging:
    name: deploy staging
    # promote intentionally NOT in needs[]: a push to the `staging` branch
    # deploys staging from the staging tag without minting a prod tag.
    # deploy-prod still requires promote, which only runs on main — so the
    # staging branch can never reach production.
    needs: [build]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: [self-hosted, signal-scout-runner]
    environment:
      name: staging
      url: https://staging.signal-scout.com
    steps:
      - uses: actions/checkout@v4
      - name: deploy staging via Portainer standard stack
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STAGING_TAG:         ${{ needs.build.outputs.staging_tag }}
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/portainer_deploy.py 29 21 "$STAGING_TAG" deploy/signal-scout-staging.compose.yml && break
            echo "deploy attempt $i failed (WiFi/timeout?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
      - name: smoke staging (2-minute /healthz window)
        run: |
          for i in $(seq 1 24); do
            if curl -sf -m 5 https://staging.signal-scout.com/api/v1/healthz; then
              echo "staging healthy ($i)"; exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-prod:
    name: deploy production
    needs: [build, promote, deploy-staging]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.promote.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: [self-hosted, signal-scout-runner]
    environment:
      name: production
      url: https://signal-scout.com
    steps:
      - uses: actions/checkout@v4
      - name: capture current prod tag (rollback target)
        id: prev
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
        run: |
          echo "tag=$(python3 scripts/portainer_deploy.py gettag 28)" >> "$GITHUB_OUTPUT"
      - name: deploy prod via Portainer standard stack
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PROD_TAG:            ${{ needs.build.outputs.prod_tag }}
        run: |
          for i in 1 2 3 4 5; do
            python3 scripts/portainer_deploy.py 28 21 "$PROD_TAG" deploy/signal-scout-prod.compose.yml && break
            echo "deploy attempt $i failed (WiFi/timeout?), retry in $((i*15))s"; sleep $((i*15)); [ "$i" = 5 ] && exit 1
          done
      - name: smoke prod (4-minute /healthz window)
        id: smoke_prod
        run: |
          for i in $(seq 1 48); do
            if curl -sf -m 5 https://signal-scout.com/api/v1/healthz; then
              echo "prod healthy ($i)"; exit 0
            fi
            sleep 5
          done
          exit 1
      - name: auto-rollback on prod smoke failure
        if: failure() && steps.smoke_prod.outcome == 'failure' && steps.prev.outputs.tag != ''
        env:
          PORTAINER_URL:       http://INFRA_VM_IP:9000
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
        run: |
          echo "rolling back prod to ${{ steps.prev.outputs.tag }}"
          for i in 1 2 3; do
            python3 scripts/portainer_deploy.py 28 21 "${{ steps.prev.outputs.tag }}" deploy/signal-scout-prod.compose.yml && break
            echo "rollback attempt $i failed, retry in $((i*10))s"; sleep $((i*10)); [ "$i" = 3 ] && exit 1
          done

  coverage-sweep:
    name: coverage alert sweep (post-deploy)
    needs: [deploy-prod]
    if: needs.deploy-prod.result == 'success'
    runs-on: [self-hosted, signal-scout-runner]
    environment:
      name: production
      url: https://signal-scout.com
    timeout-minutes: 10
    steps:
      - name: ssh -> prod LXC + run sweep inside the app container
        env:
          SSH_KEY: ${{ secrets.LXC_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/lxc_deploy
          chmod 600 ~/.ssh/lxc_deploy
          ssh-keyscan -H "${{ env.LXC_IP }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/lxc_deploy -o StrictHostKeyChecking=accept-new \
              deploy@"${{ env.LXC_IP }}" bash -s <<'REMOTE'
            set -euo pipefail
            docker exec signal-scout-prod python -m run_coverage_sweep --verbose
          REMOTE
