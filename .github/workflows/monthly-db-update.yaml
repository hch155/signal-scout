name: Monthly Database Update

on:
  schedule:
    - cron: '15 19 27 * *' # 27th of every month at 20:15 Warsaw time (19:15 UTC)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  issues: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python 3.12.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Save previous record count
        id: prev_count
        run: |
          count=$(python -c "
          import sqlite3, os
          db = os.path.join('${{ github.workspace }}', 'src', 'instance', 'stations.db')
          conn = sqlite3.connect(db)
          print(conn.execute('SELECT COUNT(*) FROM base_station').fetchone()[0])
          conn.close()
          ")
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Previous record count: $count"

      - name: Clean old Excel files
        run: rm -f base_station_data/*.xlsx

      - name: Download new UKE data
        run: python scripts/download_uke_data.py

      - name: Validate downloads
        run: python scripts/validate_db_update.py --step downloads

      - name: Backup current database
        run: cp src/instance/stations.db src/instance/stations.db.bak

      - name: Rebuild database
        run: python scripts/stations_database_setup.py

      - name: Validate new database
        run: |
          python scripts/validate_db_update.py \
            --step database \
            --previous-count ${{ steps.prev_count.outputs.count }}

      - name: Update data.md with new date
        run: python scripts/update_data_date.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_station_data/*.xlsx src/instance/stations.db src/content/data.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          MONTH=$(date +'%B %Y')
          git commit -m "chore: database update $MONTH"
          git push

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Database Update Failed - ${month}`,
              body: [
                '## Monthly Database Update Failed',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Triggered at:** ${new Date().toISOString()}`,
                '',
                'Please investigate the workflow logs for details.',
                '',
                '### Common causes',
                '- UKE website is down or files not yet updated',
                '- Missing Excel files (expected 14)',
                '- Record count dropped more than 5%',
                '- Coordinates outside Polish bounds',
                '- Duplicate data detected',
              ].join('\n'),
              labels: ['automated', 'database-update']
            });
