name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install flake8
        run: pip install flake8

      - name: Syntax errors check
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code quality warnings
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run unit + integration tests with coverage
        run: |
          pytest tests/unit tests/integration \
            --cov=src --cov-report=term-missing --cov-fail-under=80 -v

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        run: pytest tests/e2e -v --browser chromium

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r src/ -ll --skip B101,B104

      - name: Dependency audit
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # pygments - no fix available yet
        continue-on-error: false
