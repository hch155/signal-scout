name: ci

# DISABLED auto-trigger 2026-04-24: GitHub Actions billing for this
# private repo hit the spending limit mid-sprint. Tests now run locally
# (pre-push hook in scripts/git-hooks/pre-push) — Mac M-series finishes
# the full suite in ~60s vs. 3-5min on ubuntu-latest, so the cycle is
# actually faster off-Actions. CD (cd.yaml) still triggers on push to
# main; only PR-level checks are disabled.
#
# To run a one-shot CI check on demand:
#   gh workflow run ci.yaml --ref <branch>
#
# To re-enable auto-trigger: restore the `pull_request` + `push` blocks.
on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install ruff
        run: pip install ruff==0.8.4

      # ruff replaces flake8 — same coverage, ~100x faster, single binary.
      # Failures-only check first; soft style warnings second.
      - name: Lint (errors)
        run: ruff check src/ tests/ scripts/ --select=E9,F63,F7,F82
      - name: Lint (warnings — non-blocking)
        run: ruff check src/ tests/ scripts/ --line-length=127 --exit-zero

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Run unit + integration tests with coverage
        run: |
          pytest tests/unit tests/integration \
            --cov=src --cov-report=term-missing --cov-fail-under=80 -v

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements-test.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        run: pytest tests/e2e -v --browser chromium

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r src/ -ll --skip B101,B104

      - name: Dependency audit
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # pygments - no fix available yet
        continue-on-error: false

  # PR #7: container & filesystem scanning + SBOM. Runs in parallel with
  # test/security; doesn't gate them.
  trivy:
    name: Trivy filesystem + image scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-dirs: 'venv,tests/fixtures,src/static/dist,mobile,base_station_data'

      - name: Build image (multi-stage)
        run: docker build -t signal-scout:ci .

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: signal-scout:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  sbom:
    name: SBOM (CycloneDX) artifact
    runs-on: ubuntu-latest
    needs: trivy
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t signal-scout:ci .

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: signal-scout:ci
          format: cyclonedx-json
          output-file: signal-scout-sbom.cdx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-scout-sbom
          path: signal-scout-sbom.cdx.json
          retention-days: 90
