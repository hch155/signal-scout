name: cd

on:
  push:
    branches: [main]


jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up environment
        run: |
          echo "ENV=PRODUCTION" >> $GITHUB_ENV
      
      - name: Set up Python 3.12.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.2' 

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: gcloud info

      - name: Ensure GCS bucket for users.db persistence (idempotent)
        # PR #11: persist users.db across deploys via Cloud Run gcsfuse volume.
        # Bucket name is project-prefixed (must be globally unique). Single-region
        # to match the Cloud Run region for low latency. Uniform access (no ACLs).
        # Re-runs are safe — already-exists is the success path.
        run: |
          BUCKET="GCP_PROJECT_ID-users-db"
          if ! gcloud storage buckets describe "gs://${BUCKET}" --project=GCP_PROJECT_ID >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" \
              --project=GCP_PROJECT_ID \
              --location=europe-central2 \
              --uniform-bucket-level-access
            echo "  ✓ created gs://${BUCKET}"
          else
            echo "  ⏭  gs://${BUCKET} already exists"
          fi

      - name: Build and push Docker image
        run: gcloud builds submit --tag europe-central2-docker.pkg.dev/GCP_PROJECT_ID/signal-scout-repo/signal-scout:latest .
        
      - name: Deploy to Cloud Run
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
          PLAUSIBLE_SCRIPT_URL: ${{ secrets.PLAUSIBLE_SCRIPT_URL }}
        # --min-instances=1 keeps one warm instance, eliminating cold-start
        # latency for both real visitors and the 60s metrics scrape from the
        # NUC (consistent series, no scrape gaps from cold spin-up).
        # Cost-optimized config for hobby/pre-promotion traffic (~$1/mo
        # historical baseline). Signed-cookie sessions (no Flask-Session
        # filesystem state) make scale-to-zero safe — no per-instance state.
        #
        #   --min-instances=0   : scales to zero when idle. ~$0 baseline cost.
        #                         Cold start ~1-3s on first request after idle.
        #   --max-instances=2   : caps peak; even if scraper goes wild, ≤2 instances.
        #   --memory=1Gi        : back to original. App boots fine in 1Gi
        #                         per local Docker test; the earlier 503s were
        #                         CSRF-related, not OOM (now fixed by signed
        #                         cookies). If 503s return → bump to 2Gi.
        #   --timeout=60        : keep low so stuck workers cycle fast
        #   --session-affinity  : kept as belt-and-suspenders (signed cookies
        #                         already make sessions instance-agnostic, but
        #                         affinity helps RPS uniformity for hot caches)
        #
        # When promoting the app: flip --min-instances=1 + --memory=2Gi to
        # eliminate cold-starts for users (~$5-8/mo).
        run: |
          gcloud run deploy signal-scout \
            --image europe-central2-docker.pkg.dev/GCP_PROJECT_ID/signal-scout-repo/signal-scout:latest \
            --region europe-central2 \
            --allow-unauthenticated \
            --project GCP_PROJECT_ID \
            --min-instances=0 \
            --max-instances=2 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=60 \
            --session-affinity \
            --execution-environment=gen2 \
            --add-volume=name=users-db,type=cloud-storage,bucket=GCP_PROJECT_ID-users-db \
            --add-volume-mount=volume=users-db,mount-path=/mnt/users-db \
            --update-env-vars SECRET_KEY="${SECRET_KEY}",ENV=PRODUCTION,METRICS_BEARER_TOKEN="${METRICS_BEARER_TOKEN}",PLAUSIBLE_DOMAIN="${PLAUSIBLE_DOMAIN}",PLAUSIBLE_SCRIPT_URL="${PLAUSIBLE_SCRIPT_URL}",USERS_DB_PATH=/mnt/users-db/users.db

        



