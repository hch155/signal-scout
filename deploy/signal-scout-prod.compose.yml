# signal-scout PROD stack — the prod host (signal-scout-lxc)
# Pulls from Harbor, runs Flask app on port 8080.
# NPM (Hetzner) proxies signal-scout.com → TS_LXC_IP:8080
#
# Usage:
#   IMAGE_TAG=1.0.5-abc1234 docker compose -f signal-scout-prod.compose.yml up -d
#
# Rollback:
#   IMAGE_TAG=1.0.4-prevsha docker compose -f signal-scout-prod.compose.yml up -d
#
# .env (gitignored, lives in /opt/stacks/signal-scout-prod/.env):
#   IMAGE_TAG=1.0.5-abc1234
#   ENV=PRODUCTION
#   SECRET_KEY=<random 64-char>
#   SENDGRID_API_KEY=...
#   GOOGLE_OAUTH_CLIENT_ID=...
#   GOOGLE_OAUTH_CLIENT_SECRET=...
#   GITHUB_OAUTH_CLIENT_ID=...
#   GITHUB_OAUTH_CLIENT_SECRET=...
#   METRICS_BEARER_TOKEN=...
#   DEFAULT_RATE_LIMIT=16 per minute
#   RATELIMIT_STORAGE_URI=redis://redis:6379/0

services:
  app:
    image: harbor.example.local/signal-scout/app:${IMAGE_TAG:-latest}
    container_name: signal-scout-prod
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      APP_VERSION: "dev"
      # Secrets resolve from the Portainer stack Env array (preserved verbatim
      # across every deploy by portainer_deploy.py). Kept here as explicit refs
      # so this compose is a FAITHFUL fallback — it can never silently drop
      # OAuth the way an env_file-only compose did in the 2026-07-04 incident.
      SECRET_KEY: ${SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # SQLite + monthly UKE refresh
      - ./instance:/app/instance
      # Prometheus multiproc dir (per docs)
      - prometheus_multiproc:/tmp/prometheus_multiproc
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/v1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      # Watchtower auto-update opt-in (rozważ na staging only)
      com.centurylinklabs.watchtower.enable: 'false'

  redis:
    image: redis:7-alpine
    container_name: signal-scout-prod-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

volumes:
  prometheus_multiproc:
  redis-data:
